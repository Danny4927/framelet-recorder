[package]
name = "framelet-settings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
framelet-core = { path = "../core", version = "0.1.0" }
# Reviewed in ADR-0023. Only this crate may depend on serde/toml
# (scripts/check-architecture.py).
serde = { version = "=1.0.229", features = ["derive"] }
toml = { version = "=1.2.3", default-features = false, features = ["std", "serde", "parse", "display"] }

[dev-dependencies]
# Same crate, plus the shared port contract suites for tests/contract.rs (ADR-0021).
framelet-core = { path = "../core", version = "0.1.0", features = ["contract-tests"] }

[lints]
workspace = true
