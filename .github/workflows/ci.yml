name: CI

on:
  push:
    branches: [main, "feat/**", "poc/**", "chore/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Slint, PipeWire and ALSA build dependencies
        run: |
          packages="libxkbcommon-dev libwayland-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libfontconfig1-dev libfreetype6-dev libpipewire-0.3-dev libasound2-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good"
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install --yes -o Acquire::Retries=3 $packages || {
            echo "Package mirror returned a stale index; refreshing and retrying once."
            sudo apt-get update -o Acquire::Retries=3
            sudo apt-get install --yes -o Acquire::Retries=3 $packages
          }
      - uses: Swatinem/rust-cache@v2
      - name: Enforce Rust safety and hexagonal architecture
        run: python scripts/check-architecture.py
      - name: Check documentation structure and local links
        run: python scripts/check-docs.py
      - run: cargo fmt --all -- --check
      - name: Resolve workspace dependencies
        run: cargo check --workspace
      - name: Upload regenerated workspace lockfile
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Check isolated GStreamer media PoC
        run: cargo check --manifest-path poc/media-gstreamer/Cargo.toml
      - name: Test isolated GStreamer media PoC
        run: cargo test --manifest-path poc/media-gstreamer/Cargo.toml
      - name: Lint isolated GStreamer media PoC
        run: cargo clippy --manifest-path poc/media-gstreamer/Cargo.toml --all-targets -- -D warnings
      - name: Format isolated GStreamer media PoC
        run: cargo fmt --manifest-path poc/media-gstreamer/Cargo.toml -- --check
      - name: Check isolated Wayland portal PoC
        run: cargo check --manifest-path poc/wayland-portal/Cargo.toml
      - name: Test isolated Wayland portal PoC
        run: cargo test --manifest-path poc/wayland-portal/Cargo.toml
      - name: Lint isolated Wayland portal PoC
        run: cargo clippy --manifest-path poc/wayland-portal/Cargo.toml --all-targets -- -D warnings
      - name: Format isolated Wayland portal PoC
        run: cargo fmt --manifest-path poc/wayland-portal/Cargo.toml -- --check
      - name: Check isolated microphone capture PoC
        run: cargo check --manifest-path poc/microphone-cpal/Cargo.toml
      - name: Test isolated microphone capture PoC
        run: cargo test --manifest-path poc/microphone-cpal/Cargo.toml
      - name: Lint isolated microphone capture PoC
        run: cargo clippy --manifest-path poc/microphone-cpal/Cargo.toml --all-targets -- -D warnings
      - name: Format isolated microphone capture PoC
        run: cargo fmt --manifest-path poc/microphone-cpal/Cargo.toml -- --check
      - name: Test microphone ring concurrency model
        run: cargo test --manifest-path poc/microphone-cpal/Cargo.toml --lib loom_tests
      - name: Verify visual regression baseline
        env:
          FRAMELET_RUN_VISUAL_TESTS: "1"
          SLINT_SNAPSHOT_MODE: verify
        run: cargo test -p framelet-desktop --test visual_regression -- --exact main_window_default_state_matches_reference
      - name: Persist regenerated workspace lockfile
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        shell: bash
        run: |
          git diff --binary -- Cargo.lock > "$RUNNER_TEMP/cargo-lock.patch"
          if [[ ! -s "$RUNNER_TEMP/cargo-lock.patch" ]]; then
            echo "Cargo.lock is already up to date."
            exit 0
          fi

          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git fetch origin "$branch"
          git checkout -B "$branch" "origin/$branch"
          git apply --3way "$RUNNER_TEMP/cargo-lock.patch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore(deps): refresh workspace lockfile"
          git push origin "HEAD:$branch"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Enforce Rust safety and hexagonal architecture
        run: python scripts/check-architecture.py
      - name: Check documentation structure and local links
        run: python scripts/check-docs.py
      - run: cargo fmt --all -- --check
      - name: Resolve workspace dependencies
        run: cargo check --workspace
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Audit RustSec advisories
        # Deny unsound advisories and vulnerabilities; report unmaintained
        # transitive crates without failing when no fixed upgrade exists.
        run: cargo audit --deny unsound
      - name: Check licenses, sources, bans and advisories
        run: cargo deny check

  coverage:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install native coverage build dependencies
        run: |
          packages="libxkbcommon-dev libwayland-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libfontconfig1-dev libfreetype6-dev libpipewire-0.3-dev libasound2-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good"
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install --yes -o Acquire::Retries=3 $packages || {
            echo "Package mirror returned a stale index; refreshing and retrying once."
            sudo apt-get update -o Acquire::Retries=3
            sudo apt-get install --yes -o Acquire::Retries=3 $packages
          }
      - name: Install LLVM coverage tools
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate workspace coverage report
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: lcov.info
          if-no-files-found: error
