name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Slint build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libxkbcommon-dev libwayland-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libfontconfig1-dev libfreetype6-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Generate initial visual baseline
        env:
          FRAMELET_RUN_VISUAL_TESTS: "1"
          SLINT_SNAPSHOT_MODE: create-missing
        run: |
          cargo test -p framelet-desktop --test visual_regression -- --exact main_window_default_state_matches_reference
          echo "FRAMELET_SNAPSHOT_BASELINE_BASE64_BEGIN"
          base64 -w0 apps/desktop/tests/snapshots/main-window/default.png
          echo
          echo "FRAMELET_SNAPSHOT_BASELINE_BASE64_END"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
