name: CI

on:
  push:
    branches: [main, "feat/**", "poc/**", "chore/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs of the same branch/PR; never cancel runs on main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Slint, PipeWire and ALSA build dependencies
        run: |
          packages="libxkbcommon-dev libwayland-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libfontconfig1-dev libfreetype6-dev libpipewire-0.3-dev libasound2-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good"
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install --yes -o Acquire::Retries=3 $packages || {
            echo "Package mirror returned a stale index; refreshing and retrying once."
            sudo apt-get update -o Acquire::Retries=3
            sudo apt-get install --yes -o Acquire::Retries=3 $packages
          }
      - uses: Swatinem/rust-cache@v2
      - name: Enforce Rust safety and hexagonal architecture
        run: python scripts/check-architecture.py
      - name: Check documentation structure and local links
        run: python scripts/check-docs.py
      - name: Test the traceability checker
        run: python scripts/test_check_traceability.py
      - name: Check requirement traceability
        run: python scripts/check-traceability.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Verify visual regression baseline
        env:
          FRAMELET_RUN_VISUAL_TESTS: "1"
          SLINT_SNAPSHOT_MODE: verify
        run: cargo test -p framelet-desktop --test visual_regression -- --exact main_window_default_state_matches_reference
      - name: Upload visual regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slint-visual-regression
          path: target/slint-snapshots/
          if-no-files-found: ignore
          retention-days: 7

  poc:
    name: poc (${{ matrix.poc }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        poc: [media-gstreamer, wayland-portal, microphone-cpal]
    defaults:
      run:
        working-directory: poc/${{ matrix.poc }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Slint, PipeWire and ALSA build dependencies
        working-directory: .
        run: |
          packages="libxkbcommon-dev libwayland-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libfontconfig1-dev libfreetype6-dev libpipewire-0.3-dev libasound2-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good"
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install --yes -o Acquire::Retries=3 $packages || {
            echo "Package mirror returned a stale index; refreshing and retrying once."
            sudo apt-get update -o Acquire::Retries=3
            sudo apt-get install --yes -o Acquire::Retries=3 $packages
          }
      - uses: Swatinem/rust-cache@v2
        with:
          # Isolated PoCs build into their own target directory, which the
          # default workspace cache does not cover.
          workspaces: poc/${{ matrix.poc }} -> target
          key: ${{ matrix.poc }}
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Test microphone ring concurrency model
        if: matrix.poc == 'microphone-cpal'
        run: cargo test --lib loom_tests

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Enforce Rust safety and hexagonal architecture
        run: python scripts/check-architecture.py
      - name: Check documentation structure and local links
        run: python scripts/check-docs.py
      - name: Test the traceability checker
        run: python scripts/test_check_traceability.py
      - name: Check requirement traceability
        run: python scripts/check-traceability.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit and cargo-deny (prebuilt binaries)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: Audit RustSec advisories
        # Deny unsound advisories and vulnerabilities; report unmaintained
        # transitive crates without failing when no fixed upgrade exists.
        run: cargo audit --deny unsound
      - name: Check licenses, sources, bans and advisories
        run: cargo deny check

  coverage:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install native coverage build dependencies
        run: |
          packages="libxkbcommon-dev libwayland-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libfontconfig1-dev libfreetype6-dev libpipewire-0.3-dev libasound2-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good"
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install --yes -o Acquire::Retries=3 $packages || {
            echo "Package mirror returned a stale index; refreshing and retrying once."
            sudo apt-get update -o Acquire::Retries=3
            sudo apt-get install --yes -o Acquire::Retries=3 $packages
          }
      - name: Install LLVM coverage tools
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate workspace coverage report
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: lcov.info
          if-no-files-found: error
