[workspace]
resolver = "3"
exclude = ["poc/media-gstreamer"]

members = ["apps/desktop", "crates/capture-api", "crates/core", "crates/storage"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
